# ============================================================
# TRAJEKTIA — Docker Compose Production (VPS OVH Québec)
# Version  : 1.0.0
# Date     : 2026-04-28
# OS cible : Ubuntu 22.04 LTS
# Souveraineté : Données 100% hébergées au Québec (Loi 25)
#
# Prérequis sur le VPS :
#   - Docker Engine >= 24.x
#   - Docker Compose v2 >= 2.20
#   - Domaine configuré avec DNS A record pointant vers le VPS
#   - Ports ouverts : 80, 443 (Traefik), 5432 (interne uniquement)
#
# Déploiement :
#   cp .env.production .env
#   docker compose up -d
# ============================================================

version: "3.9"

networks:
  trajektia_net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  n8n_data:
  letsencrypt:

# ============================================================
# TRAEFIK — Reverse Proxy + SSL Let's Encrypt
# ============================================================
services:
  traefik:
    image: traefik:v3.0
    container_name: trajektia_traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Redirection HTTP → HTTPS globale
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - trajektia_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth-traefik"
      - "traefik.http.middlewares.auth-traefik.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  # ============================================================
  # POSTGRESQL — Coffre-fort Supabase (auto-hébergé)
  # NOTE : Remplace l'instance Supabase cloud pour la production
  # ============================================================
  postgres:
    image: supabase/postgres:15.6.1.143
    container_name: trajektia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts d'initialisation (appliqués une seule fois)
      - ./packages/database/schema.sql:/docker-entrypoint-initdb.d/01_schema_v1.sql
      - ./packages/database/schema_v2.sql:/docker-entrypoint-initdb.d/02_schema_v2.sql
    networks:
      - trajektia_net
    # Pas exposé à l'extérieur — accessible uniquement via le réseau interne
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # POSTGREST — API REST automatique sur PostgreSQL
  # (Alternative légère à Supabase cloud pour l'API de données)
  # ============================================================
  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: trajektia_postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_POOL: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trajektia_net


  # ============================================================
  # NEO4J — MemMachine (Graphe de Connaissances de Carrière CKG)
  # ============================================================
  neo4j:
    image: neo4j:5.18-community
    container_name: trajektia_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
      NEO4J_dbms_memory_pagecache_size: 1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - trajektia_net
    # Bolt interne uniquement — pas d'exposition publique du port 7687
    # Browser Neo4j accessible via Traefik uniquement
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neo4j.rule=Host(`graph.${DOMAIN}`)"
      - "traefik.http.routers.neo4j.entrypoints=websecure"
      - "traefik.http.routers.neo4j.tls.certresolver=letsencrypt"
      - "traefik.http.services.neo4j.loadbalancer.server.port=7474"

  # ============================================================
  # N8N — Orchestrateur / Pont BD ↔ Coffre-fort Souverain
  # ============================================================
  n8n:
    image: n8nio/n8n:1.49.0
    container_name: trajektia_n8n
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.${DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      # Variables Brilliant Directories (pour les workflows)
      BD_WEBSITE_URL: ${BD_WEBSITE_URL}
      BD_API_KEY: ${BD_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trajektia_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # ============================================================
  # FASTAPI STITCHER — API publique (fiches métier)
  # ============================================================
  fastapi:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: trajektia_api
    restart: unless-stopped
    environment:
      SUPABASE_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: '["https://${DOMAIN}", "https://${BD_WEBSITE_URL}"]'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trajektia_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  # ============================================================
  # FRONTEND ASTRO — Vitrine Web & Interface Utilisateur
  # ============================================================
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: trajektia_frontend
    restart: unless-stopped
    networks:
      - trajektia_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

