[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trajektia-ckg"
version = "0.1.0"
description = "Trajektia Career Knowledge Graph models & utilities"
dependencies = [
    "neo4j>=5.0.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
