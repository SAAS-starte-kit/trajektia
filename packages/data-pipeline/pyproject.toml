[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trajektia-data-pipeline"
version = "0.1.0"
description = "Trajektia ETL and Data Ingestion Pipelines"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.30.0",
    "beautifulsoup4>=4.12.0"
]

[tool.setuptools.packages.find]
where = ["."]
